name: qagent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qagent}
      POSTGRES_DB: ${POSTGRES_DB:-qagent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qagent}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m qagent.db_init &&
             uvicorn qagent.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./apps/api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "qagent.worker.tasks.celery_app", "worker", "--loglevel=info", "-Q", "qagent", "--concurrency=4"]
    # The worker reaches out to third-party applications. It gets no ports, no
    # Docker socket, and in a hosted deployment a default-deny egress policy.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: 1.0

  fixture:
    build:
      context: ./packages/fixtures/buggy-shop
    ports:
      - "8080:8080"
    profiles: ["eval"]

volumes:
  pgdata:
