apiVersion: v1
kind: Namespace
metadata:
  name: qagent
  labels:
    app.kubernetes.io/name: qagent
---
# Default-deny egress for the whole namespace.
#
# The worker fetches user-supplied URLs by design, which is exactly the shape of
# an SSRF primitive. `modules/runner/executor.guard_target` is the first line of
# defence and rejects link-local, loopback and private ranges; this is the
# second, because a guard that lives in application code is one refactor away
# from being bypassed.
#
# Deliberately incomplete: it permits DNS, Postgres and Redis and nothing else.
# An operator has to add the egress rule matching the environments they actually
# want scanned. A policy that allowed everything by default would be decoration.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: qagent
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: redis
      ports:
        - protocol: TCP
          port: 6379
