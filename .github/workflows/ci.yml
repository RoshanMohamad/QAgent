name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: apps/api
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/api
        run: ruff check qagent

      - name: Unit tests
        working-directory: apps/api
        run: pytest tests -q

  evaluate:
    # The quality gate for QAgent itself: a change that degrades detection or
    # raises false positives against the fixture fails the build (ADR-0003).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ./apps/api
          pip install "uvicorn[standard]" flask

      - name: Start fixture applications
        run: |
          cd packages/fixtures/buggy-shop
          uvicorn app:app --port 8080 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 1
          done
          cd ../task-tracker
          FLASK_APP=app.py flask run --port 8081 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8081/health && break
            sleep 1
          done

      - name: Evaluate (buggy-shop, FastAPI)
        env:
          QAGENT_LLM_PROVIDER: "null"
        run: qagent evaluate --url http://127.0.0.1:8080 --fixtures packages/fixtures

      - name: Evaluate (task-tracker, Flask)
        # This was intentionally < 100% for a long time: BUG-201 is an IDOR and
        # no generator rule compares two identities. It is now found by the IDOR
        # probe (modules/security/idor.py), which the fixture enables by
        # declaring both identities, so this fixture reads 6/6.
        #
        # The gate remains the one `evaluate` always applies - false-positive
        # rate, not detection rate (ADR-0003).
        env:
          QAGENT_LLM_PROVIDER: "null"
        run: qagent evaluate --url http://127.0.0.1:8081 --name task-tracker --fixtures packages/fixtures

      - name: Emitted suite must agree with the pipeline
        # Agent 3 emits standalone pytest files. The claim is that they are the
        # same checks, not merely similar ones - so this asserts the emitted
        # suite reaches exactly the same pass/fail split the in-process runner
        # does. If the two ever diverge, one of them is lying to a developer.
        run: |
          qagent emit --url http://127.0.0.1:8080 --out /tmp/emitted
          cd /tmp/emitted
          set +e
          QAGENT_BASE_URL=http://127.0.0.1:8080 python -m pytest . -q --tb=no > out.txt 2>&1
          set -e
          cat out.txt
          grep -q "11 failed, 7 passed" out.txt || {
            echo "::error::Emitted suite disagrees with the pipeline (expected 11 failed, 7 passed)."
            exit 1
          }

  quality-gate:
    # Dogfooding: QAgent's own GitHub Action, run against the buggy fixture.
    # The fixture has four seeded defects, so a working gate MUST block here -
    # this job asserts the failure path, which is the one that actually matters.
    # A gate that cannot say "no" is decoration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start the buggy fixture
        run: |
          pip install --upgrade pip
          pip install -e ./apps/api "uvicorn[standard]"
          cd packages/fixtures/buggy-shop
          uvicorn app:app --port 8080 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 1
          done

      - name: Gate must block on the buggy fixture
        id: gate
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:8080
          repo-path: packages/fixtures/buggy-shop
          min-coverage: "0.9"

      - name: Assert the gate blocked
        env:
          GATE_RESULT: ${{ steps.gate.outputs.result }}
        run: |
          echo "gate reported: $GATE_RESULT"
          if [ "$GATE_RESULT" != "block" ]; then
            echo "::error::The gate did not block on a fixture with four seeded defects."
            exit 1
          fi

      - name: Gate must pass when the thresholds allow the known defects
        uses: ./
        with:
          url: http://127.0.0.1:8080
          repo-path: packages/fixtures/buggy-shop
          max-critical: "2"
          max-high: "5"

  manifests:
    # ADR-0008 deferred Kubernetes manifests because untested infrastructure
    # code is a liability. This job is what keeps that from being true of these:
    # every manifest is validated against the real Kubernetes OpenAPI schemas in
    # strict mode (which rejects unknown fields - the typo class that otherwise
    # surfaces as a silently ignored setting in production).
    #
    # It does NOT prove they run. Replica counts, HPA thresholds and resource
    # limits still need a real cluster under load, and are marked `# TUNE:`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz             https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate raw manifests
        run: |
          kubeconform -strict -summary             -ignore-filename-pattern kustomization.yaml             deploy/kubernetes/base/

      - name: Validate the built kustomization
        # The built output is what actually reaches a cluster, so it is what
        # has to be valid - a kustomization can produce something no individual
        # file contained.
        run: kubectl kustomize deploy/kubernetes/base | kubeconform -strict -summary -

      - name: The placeholder secret must never be applied
        # secrets.example.yaml documents the required shape and contains
        # CHANGE_ME. A kustomization that included it would deploy an API whose
        # signing key is a literal string in a public repository.
        run: |
          if kubectl kustomize deploy/kubernetes/base | grep -q "CHANGE_ME"; then
            echo "::error::placeholder secrets reached the built manifests"
            exit 1
          fi

      - name: The worker must never receive the admin database credential
        # ADR-0007: a superuser bypasses RLS unconditionally. The worker fetches
        # user-supplied URLs, so this is the one credential separation that
        # cannot be allowed to regress silently.
        run: |
          python - <<'PY'
          import subprocess, sys, yaml
          built = subprocess.run(
              ["kubectl", "kustomize", "deploy/kubernetes/base"],
              capture_output=True, text=True, check=True,
          ).stdout
          bad = []
          for doc in yaml.safe_load_all(built):
              if not doc or doc.get("kind") not in {"Deployment", "Job"}:
                  continue
              name = doc["metadata"]["name"]
              spec = doc["spec"]["template"]["spec"]
              for container in spec.get("containers", []):
                  names = {e["name"] for e in container.get("env", [])}
                  if "ADMIN_DATABASE_URL" in names and "migrate" not in name:
                      bad.append(name)
          if bad:
              print(f"::error::admin credential reaches non-migration workloads: {bad}")
              sys.exit(1)
          print("admin credential is confined to the migration Job")
          PY

  db-integration:
    # Everything in `test` runs green with no database (README). This job is the
    # other half: a real Postgres + Redis, proving row-level security actually
    # isolates tenants under the unprivileged role db_init creates, that a real
    # `celery worker` process consuming the real broker persists a scan end to
    # end (ADR-0007), and that RBAC/rate limiting/usage hold up against real
    # infrastructure too (ADR-0008).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qagent
          POSTGRES_PASSWORD: qagent
          POSTGRES_DB: qagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qagent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgresql+psycopg://qagent:qagent@localhost:5432/qagent
      DATABASE_URL: postgresql+psycopg://qagent_app:qagent_app@localhost:5432/qagent
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      QAGENT_LLM_PROVIDER: "null"
      QAGENT_SECRET_KEY: ci-integration-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: apps/api
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "uvicorn[standard]"

      - name: Integration tests (RLS isolation + real worker)
        working-directory: apps/api
        run: pytest tests_integration -q

      - name: Migrations must upgrade an existing database, not just build a new one
        # `create_all` only ever created *missing tables*, so every schema change
        # after the first silently did nothing on a database that already
        # existed - surfacing much later as "column does not exist" at runtime.
        # This asserts the path that actually breaks: a populated database at
        # the pre-migration baseline, upgraded to head with its rows intact.
        working-directory: apps/api
        env:
          PGPASSWORD: qagent
        run: |
          set -euo pipefail
          psql -h localhost -U qagent -d postgres -c "CREATE DATABASE qagent_legacy"
          export ADMIN_DATABASE_URL=postgresql+psycopg://qagent:qagent@localhost:5432/qagent_legacy

          # Build the pre-migration schema, then remove the version table so it
          # looks exactly like a database created before Alembic existed.
          python -m alembic upgrade "$(python -c 'from qagent.db_init import BASELINE_REVISION; print(BASELINE_REVISION)')"
          psql -h localhost -U qagent -d qagent_legacy -c "DROP TABLE alembic_version"
          psql -h localhost -U qagent -d qagent_legacy -c "
            INSERT INTO organizations (id,name,slug,created_at,updated_at)
              VALUES (gen_random_uuid(),'legacy','legacy-org',now(),now());
            INSERT INTO projects (id,org_id,name,default_branch,stack,created_at,updated_at)
              SELECT gen_random_uuid(), id,'p','main','{}',now(),now() FROM organizations;
            INSERT INTO test_runs (id,org_id,project_id,status,trigger,total,passed,failed,errored,created_at,updated_at)
              SELECT gen_random_uuid(), p.org_id, p.id,'PASSED','manual',42,42,0,0,now(),now() FROM projects p;"

          DATABASE_URL=postgresql+psycopg://qagent_app:qagent_app@localhost:5432/qagent_legacy             python -c "from qagent.db_init import create_schema, _admin_engine; create_schema(_admin_engine())"

          total=$(psql -h localhost -U qagent -d qagent_legacy -tAc "SELECT total FROM test_runs")
          plan=$(psql -h localhost -U qagent -d qagent_legacy -tAc "SELECT plan::text FROM test_runs")
          echo "legacy row after upgrade: total=$total plan=$plan"
          [ "$total" = "42" ] || { echo "::error::legacy row was lost by the migration"; exit 1; }
          [ "$plan" = "{}" ] || { echo "::error::new column has no usable default"; exit 1; }

  rag-pgvector:
    # The RAG store has two vector backends and the default (JSON on stock
    # postgres) is the one almost everyone runs. This job covers the other one,
    # because testing only the default is how the pgvector path shipped broken
    # twice: once binding a type modifier as a parameter, once comparing a uuid
    # column against a varchar and silently falling back forever.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qagent
          POSTGRES_PASSWORD: qagent
          POSTGRES_DB: qagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qagent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgresql+psycopg://qagent:qagent@localhost:5432/qagent
      DATABASE_URL: postgresql+psycopg://qagent_app:qagent_app@localhost:5432/qagent
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      QAGENT_LLM_PROVIDER: "null"
      QAGENT_SECRET_KEY: ci-integration-test-secret
      QAGENT_VECTOR_BACKEND: pgvector
      QAGENT_EMBEDDING_DIMENSIONS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: apps/api
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,rag]"

      - name: RAG store on the native pgvector backend
        working-directory: apps/api
        run: pytest tests_integration/test_rag_store.py -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Test
        working-directory: apps/web
        run: npm test

      - name: Build (type-checks the API contract)
        working-directory: apps/web
        run: npm run build
