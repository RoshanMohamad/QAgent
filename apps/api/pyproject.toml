[project]
name = "qagent"
version = "0.1.0"
description = "Autonomous AI software QA engineer - API and worker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "celery>=5.4",
    # Upper bound is kombu's, not ours: kombu[redis] (celery's broker layer)
    # declares redis<6.5, and redis-py 8 breaks its transport outright - the
    # worker never finishes connecting to the broker. Because celery and redis
    # are declared here as independent requirements, pip never sees kombu's
    # cap unless we repeat it, so a fresh install would silently resolve to an
    # unusable pair. Raise this only together with celery/kombu.
    "redis>=5.2,<6.5",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "typer>=0.15",
    "rich>=13.9",
    "tenacity>=9.0",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
e2e = ["playwright>=1.48"]
security = ["semgrep>=1.90"]
# Native vector storage and ANN search. Optional: the default JSON backend
# works on stock postgres and searches in Python (modules/rag/store.py).
rag = ["pgvector>=0.3"]
# S3-compatible evidence storage (S3, Cloudflare R2, MinIO). The default
# filesystem backend needs nothing (modules/storage/local.py).
s3 = ["boto3>=1.35"]
# Distributed tracing. Optional because the CLI and the eval harness run the
# same pipeline and neither should acquire a tracing dependency to score a
# fixture (modules/observability/tracing.py).
otel = [
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-celery>=0.50b0",
]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "respx>=0.22", "flask>=3.0"]

[project.scripts]
qagent = "qagent.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qagent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "S101",  # assert: used throughout the test suite
    "B008",  # function call in argument default: this is FastAPI's Depends() idiom
]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated, and their formatting is alembic's, not ours.
# Reformatting them by hand is churn that makes a future autogenerate diff
# unreadable for no benefit - nobody reads a migration for its line length.
"migrations/versions/*.py" = ["E501", "E402", "I001", "UP"]
# Probe payloads deliberately contain credential-shaped literals.
"qagent/modules/generator/*" = ["S105", "S106"]
"tests/*" = ["S105", "S106", "E501"]
# Launches known, literal commands (sys.executable + fixed args) against a local
# Postgres/Redis the operator brought up themselves - not untrusted input.
"tests_integration/*" = ["S105", "S106", "S603", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
