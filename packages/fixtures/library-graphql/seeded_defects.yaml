# Ground truth for the library-graphql fixture (ADR-0003).
#
# Fourth fixture, and the first that is not REST: a GraphQL API (Flask +
# graphql-core, vanilla error formatting). Endpoint keys are how QAgent names a
# GraphQL root field - operation type plus /graphql/<field> - so the harness
# matches reported defects here exactly as it matches `GET /books/{id}` elsewhere
# (modules/graphql/introspection.py).
#
# Every response is HTTP 200. The only thing separating a crashed resolver from a
# correctly rejected request is the errors array, which is the capability this
# fixture exists to prove (modules/graphql/errors.py). Crashes here carry no
# `extensions.code` - graphql-core's default - so detection has to come from the
# raw exception message, the harder case.
#
# Authentication: GraphQL introspection does not expose which fields require
# credentials, so this file declares them (`graphql_protected`), exactly as an
# operator passes `qagent scan --graphql-protected`. Without that declaration QAgent
# generates no GraphQL auth check at all - guessing would flag every public field.
# A fixture seeding GraphQL auth bugs has to declare it for the same reason
# task-tracker declares two identities for its IDOR.

identities:
  primary:
    Authorization: "Bearer library-alice-token"

graphql_protected:
  - patrons
  - overdueReport
  - addBook
  - borrowBook
  - renameBook
  - returnBook

fixture: library-graphql
description: GraphQL library API with six seeded defects and three correct fields.

defects:
  - id: BUG-501
    endpoint: "QUERY /graphql/book"
    title: Identifier cast without validation in a resolver
    expected_class: real_bug
    expected_severity: high
    detect_with: malformed ID argument
    notes: >
      int(id) raises ValueError for "not-a-number". GraphQL's ID scalar accepts
      any string, so schema validation does not stop it. An absent numeric id
      returns null correctly, isolating this to the cast.

  - id: BUG-502
    endpoint: "MUTATION /graphql/addBook"
    title: Optional argument dereferenced as if required
    expected_class: real_bug
    expected_severity: high
    detect_with: happy path (optional args omitted), or explicit null
    notes: >
      ", ".join(tags) raises TypeError when the nullable 'tags' argument is
      omitted or null. The happy-path check omits optional arguments, so it
      reaches this on its own; the explicit-null check reaches the same line.

  - id: BUG-503
    endpoint: "MUTATION /graphql/borrowBook"
    title: Resource existence assumed before it is updated
    expected_class: real_bug
    expected_severity: medium
    detect_with: absent-but-well-formed ID argument
    notes: >
      The cast is guarded (malformed -> BAD_USER_INPUT). A well-formed absent id
      reaches book["available"] = False on None and raises TypeError.

  - id: BUG-504
    endpoint: "MUTATION /graphql/renameBook"
    title: Explicit null for an optional argument treated as a value
    expected_class: real_bug
    expected_severity: medium
    detect_with: explicit null for a nullable argument
    notes: >
      Omitting 'title' changes nothing, correctly. 'title: null' is valid per
      the schema and puts the key in kwargs as None; .strip() then raises
      AttributeError. GraphQL-specific: omitted and null are different inputs.

  - id: BUG-505
    endpoint: "QUERY /graphql/patrons"
    title: Field declared protected but never checked
    expected_class: real_bug
    expected_severity: critical
    detect_with: request without credentials (graphql_unauthenticated)
    notes: >
      Every other protected resolver calls _require_user first. This one returns
      every patron's email address to an anonymous caller. Same shape as
      buggy-shop's BUG-003, as a GraphQL field.

  - id: BUG-506
    endpoint: "QUERY /graphql/overdueReport"
    title: Token presence checked, token validity never checked
    expected_class: real_bug
    expected_severity: critical
    detect_with: forged alg=none bearer token (graphql_invalid_token)
    notes: >
      A missing token is rejected correctly, so the unauthenticated check passes.
      Any token at all is accepted, including an unsigned one, so only the
      forged-token check reaches this. The GraphQL twin of notes-api's BUG-405.

# Correct fields. Reported defects against these count as false positives.
# returnBook is protected and correctly enforced, so it also proves the auth
# checks do not flag a field that does its job.
clean:
  - "QUERY /graphql/health"
  - "QUERY /graphql/books"
  - "MUTATION /graphql/returnBook"
