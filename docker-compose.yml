name: qagent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qagent}
      POSTGRES_DB: ${POSTGRES_DB:-qagent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Overridable: a locally installed Postgres commonly owns 5432 already.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qagent}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    # .env.admin carries the Postgres superuser DSN that bootstraps the schema,
    # the app role and RLS (ADR-0007). It is loaded here only, because only this
    # service's startup command runs `qagent.db_init` - worker never needs it and
    # never sees it, even though it shares every other setting in .env.
    env_file:
      - .env
      - .env.admin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m qagent.db_init &&
             uvicorn qagent.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./apps/api
    # DATABASE_URL only, from .env - the unprivileged qagent_app role db_init
    # creates. The worker reaches out to arbitrary third-party targets, so it
    # must never hold Postgres superuser credentials even unused.
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Consumes both queues by default (worker/tasks.py's task_routes), so a
    # single-replica deployment still runs everything out of the box. Scale
    # `docker compose up --scale worker=3` for more of both, or add a second
    # service below listening on only `-Q qagent.performance` to scale load
    # tests independently of ordinary scans without touching this one.
    command: ["celery", "-A", "qagent.worker.tasks.celery_app", "worker", "--loglevel=info", "-Q", "qagent.scan,qagent.performance", "--concurrency=4"]
    # The worker reaches out to third-party applications. It gets no ports, no
    # Docker socket, and in a hosted deployment a default-deny egress policy.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: 1.0

  # Example of the independent-scaling seam above: uncomment to run performance
  # tests on their own worker pool instead of sharing the default one's capacity.
  # worker-performance:
  #   build: ./apps/api
  #   env_file: .env
  #   depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  #   command: ["celery", "-A", "qagent.worker.tasks.celery_app", "worker", "--loglevel=info", "-Q", "qagent.performance", "--concurrency=2"]
  #   security_opt: ["no-new-privileges:true"]
  #   read_only: true
  #   tmpfs: ["/tmp"]

  fixture:
    build:
      context: ./packages/fixtures/buggy-shop
    ports:
      - "8080:8080"
    profiles: ["eval"]

volumes:
  pgdata:
