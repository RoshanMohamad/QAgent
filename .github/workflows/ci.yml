name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: apps/api
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: apps/api
        run: ruff check qagent

      - name: Unit tests
        working-directory: apps/api
        run: pytest tests -q

  evaluate:
    # The quality gate for QAgent itself: a change that degrades detection or
    # raises false positives against the fixture fails the build (ADR-0003).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ./apps/api
          pip install "uvicorn[standard]"

      - name: Start fixture application
        run: |
          cd packages/fixtures/buggy-shop
          uvicorn app:app --port 8080 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/health && break
            sleep 1
          done

      - name: Evaluate
        env:
          QAGENT_LLM_PROVIDER: "null"
        run: qagent evaluate --url http://127.0.0.1:8080 --fixtures packages/fixtures
