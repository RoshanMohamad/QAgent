# The SHAPE of the required secrets. Never commit real values; this file exists
# so an operator knows what to create, not to be applied as-is.
#
#   kubectl create secret generic qagent-secrets -n qagent \
#     --from-literal=database-url='postgresql+psycopg://qagent_app:...@postgres:5432/qagent' \
#     --from-literal=secret-key="$(openssl rand -hex 32)" ...
#
# `admin-database-url` is separate on purpose: only the migration Job mounts it
# (ADR-0007). The API and worker connect as the unprivileged role that Job
# creates, or row-level security is silently bypassed.
apiVersion: v1
kind: Secret
metadata:
  name: qagent-secrets
  namespace: qagent
type: Opaque
stringData:
  database-url: "postgresql+psycopg://qagent_app:CHANGE_ME@postgres:5432/qagent"
  redis-url: "redis://redis:6379/0"
  celery-broker-url: "redis://redis:6379/1"
  celery-result-backend: "redis://redis:6379/2"
  secret-key: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: qagent-admin-secrets
  namespace: qagent
type: Opaque
stringData:
  # Postgres superuser. Mounted by the migration Job and nothing else.
  admin-database-url: "postgresql+psycopg://qagent:CHANGE_ME@postgres:5432/qagent"
