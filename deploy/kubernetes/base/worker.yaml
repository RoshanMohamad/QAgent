# Two worker pools, not one.
#
# This is the Kubernetes expression of the queue split ADR-0008 already built
# (`qagent.scan` / `qagent.performance`). A performance test deliberately sends
# sustained load for up to the full time limit; an ordinary scan takes seconds.
# Sharing one pool means a burst of load tests starves every scan behind them,
# and no amount of autoscaling fixes a head-of-line block.
#
# Neither pool receives the admin database credential. The worker fetches
# user-supplied URLs, so a compromise must not yield Postgres superuser access.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qagent-worker-scan
  namespace: qagent
  labels:
    app.kubernetes.io/name: qagent
    app.kubernetes.io/component: worker-scan
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: qagent
      app.kubernetes.io/component: worker-scan
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qagent
        app.kubernetes.io/component: worker-scan
    spec:
      # TUNE: a scan can run for minutes and `task_acks_late` means an
      # interrupted one is redelivered rather than lost. This gives an in-flight
      # scan time to finish instead of being redelivered on every deploy.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/example/qagent:latest
          command:
            - celery
            - -A
            - qagent.worker.tasks.celery_app
            - worker
            - --loglevel=info
            - -Q
            - qagent.scan
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: qagent-config
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: qagent-secrets, key: database-url } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: qagent-secrets, key: redis-url } }
            - name: CELERY_BROKER_URL
              valueFrom: { secretKeyRef: { name: qagent-secrets, key: celery-broker-url } }
            - name: CELERY_RESULT_BACKEND
              valueFrom: { secretKeyRef: { name: qagent-secrets, key: celery-result-backend } }
            - name: QAGENT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: qagent-secrets, key: secret-key } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            # TUNE: concurrency 4 with a memory limit sized for four in-flight
            # scans holding response bodies. A worker OOM-killed mid-scan is
            # redelivered, so an undersized limit shows up as a redelivery loop
            # rather than as an obvious crash - watch for that before tuning up.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qagent-worker-performance
  namespace: qagent
  labels:
    app.kubernetes.io/name: qagent
    app.kubernetes.io/component: worker-performance
spec:
  # TUNE: one. A load generator is supposed to saturate its target; running
  # several by default means the first real performance test accidentally
  # becomes a denial-of-service against someone's staging environment.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qagent
      app.kubernetes.io/component: worker-performance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qagent
        app.kubernetes.io/component: worker-performance
    spec:
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ghcr.io/example/qagent:latest
          command:
            - celery
            - -A
            - qagent.worker.tasks.celery_app
            - worker
            - --loglevel=info
            - -Q
            - qagent.performance
            - --concurrency=2
          envFrom:
            - configMapRef:
                name: qagent-config
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: qagent-secrets, key: database-url } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: qagent-secrets, key: redis-url } }
            - name: CELERY_BROKER_URL
              valueFrom: { secretKeyRef: { name: qagent-secrets, key: celery-broker-url } }
            - name: CELERY_RESULT_BACKEND
              valueFrom: { secretKeyRef: { name: qagent-secrets, key: celery-result-backend } }
            - name: QAGENT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: qagent-secrets, key: secret-key } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            # A load generator is CPU-bound by nature, unlike a scan worker.
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Scan workers scale on queue depth, not CPU: a worker blocked on a slow target
# uses almost no CPU while the backlog grows, so CPU-based autoscaling would sit
# still exactly when capacity is most needed.
#
# TUNE: requires an external metrics adapter (KEDA, or prometheus-adapter
# exporting Redis list length). Left as `External` rather than silently
# downgraded to CPU, because a CPU HPA here would look like it worked.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: qagent-worker-scan
  namespace: qagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qagent-worker-scan
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: External
      external:
        metric:
          name: redis_list_length
          selector:
            matchLabels:
              queue: qagent.scan
        target:
          type: AverageValue
          # TUNE: scale out past roughly five queued scans per worker.
          averageValue: "5"
  behavior:
    scaleDown:
      # Long, because a scan in flight is lost work if its pod is removed.
      stabilizationWindowSeconds: 600
