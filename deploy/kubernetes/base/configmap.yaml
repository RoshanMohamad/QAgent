apiVersion: v1
kind: ConfigMap
metadata:
  name: qagent-config
  namespace: qagent
data:
  QAGENT_ENV: "production"
  QAGENT_LLM_PROVIDER: "null"
  QAGENT_STORAGE_BACKEND: "s3"
  QAGENT_VECTOR_BACKEND: "json"
  QAGENT_TRACING_ENABLED: "false"
  # TUNE: a scan holds a connection for its whole duration, so this bounds how
  # long one stuck target can occupy a worker slot. 120s is the compose default;
  # raise it only if real targets are genuinely slower, because every increase
  # is also an increase in how long a hung scan blocks capacity.
  QAGENT_RUNNER_TIMEOUT_SECONDS: "120"
  QAGENT_MAX_LLM_CALLS: "40"
  QAGENT_MAX_USD: "2.00"
